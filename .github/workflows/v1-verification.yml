name: SARANAM v1 evidence checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run readiness tests
        run: node --test scripts/check-v1-readiness.test.mjs
      - name: Display release blockers
        run: node scripts/check-v1-readiness.mjs --report
      - name: State deployment policy
        run: echo "No deployments from this workflow. Gate C requires strict verification and owner-approved production release."
