name: Deploy SARANAM to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Verify Cloudflare secrets
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CF_ACCOUNT" || -z "$CF_TOKEN" ]]; then
            echo "Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Actions secrets."
            exit 1
          fi
      - name: Create Cloudflare Pages project if needed
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/saranam-ayyappa"
          status=$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "$api")
          if [[ "$status" == "404" ]]; then
            echo "Creating Cloudflare Pages project saranam-ayyappa"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects" -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" --data '{"name":"saranam-ayyappa","production_branch":"main"}' > /tmp/pages-create.json
          elif [[ "$status" != "200" ]]; then
            echo "Cloudflare project lookup failed (HTTP ${status}). Check token permissions and account ID."
            exit 1
          fi
          project=/tmp/pages-project.json
          if [[ "$status" == "404" ]]; then project=/tmp/pages-create.json; fi
          branch=$(jq -er '.result.production_branch' "$project")
          echo "Cloudflare production branch: $branch"
          test "$branch" = main
      - name: Validate homepage JavaScript
        run: node --check script.js && node --check sw.js
      - name: Prepare static distribution
        run: |
          mkdir -p _site/assets
          cp index.html ayyappa-guide.html episode-01.html styles.css script.js robots.txt sitemap.xml 404.html _headers manifest.webmanifest sw.js saranam-icon.svg _site/
          cp assets/ayyappa-forest.mp4 assets/hero-poster.jpg _site/assets/
          cp -R assets/story _site/assets/
          sed -i "s/__SARANAM_RELEASE__/$GITHUB_SHA/g" _site/sw.js
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=saranam-ayyappa --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Show deployment link
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Cloudflare deployment URL: ${DEPLOYMENT_URL}"

      - name: Verify production serves this release
        run: |
          set -euo pipefail
          base=https://saranam-ayyappa.pages.dev
          for file in index.html ayyappa-guide.html episode-01.html sitemap.xml sw.js; do
            curl -fsSL --retry 3 --max-time 20 "$base/$file?release=$GITHUB_SHA" -o /tmp/saranam-live
            cmp "_site/$file" /tmp/saranam-live
          done
          test "$(curl -sSL -o /dev/null -w '%{http_code}' "$base/does-not-exist")" = 404
